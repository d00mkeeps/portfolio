version: '3.9'

services:
  portfolio:
    build: .
    container_name: miles-portfolio
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - default
      - observability
      - crucible-net
    labels:
      - "traefik.enable=false"

networks:
  observability:
    external: true
    name: observability
  crucible-net:
    external: true
    name: sturdy-robot_crucible-net
